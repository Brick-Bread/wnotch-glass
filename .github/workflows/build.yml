name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Get the supported Notch API
        uses: actions/checkout@v7.0.1
        with:
          repository: Brick-Bread/WNotch
          ref: 5bdc3ac5c026065757686f8de904054bd9571961
          path: .notch-reference
      - name: Build the API reference
        shell: pwsh
        run: dotnet build .notch-reference/src/Notch.Core -c Release -o .notch-core --nologo
      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -NotchCorePath "$PWD/.notch-core/Notch.Core.dll"
      - name: Validate themes and render previews
        shell: pwsh
        run: dotnet run --project tools/ThemeCheck -p:NotchCorePath="$PWD/.notch-core/Notch.Core.dll" -- dist/brick-bread.glass artifacts
      - name: Upload plugin and previews
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notch-glass
          path: |
            dist/*.zip
            artifacts/*.png
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: notch-glass
          path: release-files
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
            throw 'The tag must match the plugin manifest version.'
          }
          $archive = Get-ChildItem release-files/dist/*.zip
          if ($archive.Count -ne 1) { throw 'Expected exactly one plugin ZIP.' }
          $existing = gh release view $env:GITHUB_REF_NAME --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assets = ($existing | ConvertFrom-Json).assets
            $zips = @($assets | Where-Object { $_.name.EndsWith('.zip') })
            if ($zips.Count -gt 0) {
              if ($zips.Count -ne 1 -or $zips[0].name -ne $archive.Name) {
                throw 'An existing release has a different plugin ZIP. Review it before publishing.'
              }
              Write-Output 'The plugin ZIP is already attached; leaving it unchanged.'
            } else {
              gh release upload $env:GITHUB_REF_NAME $archive.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            }
          } else {
            gh release create $env:GITHUB_REF_NAME $archive.FullName --verify-tag --title "Notch Glass $($manifest.version)" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
